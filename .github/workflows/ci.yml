name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install 7-Zip for interoperability validation
        run: |
          sudo apt-get update
          sudo apt-get install --yes 7zip

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test, including 7-Zip interoperability
        run: bun test

      - name: Build
        run: bun run build

      - name: Audit release artifacts
        run: bun run audit:dist
